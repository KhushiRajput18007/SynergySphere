<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient definitions -->
  <defs>
    <!-- Primary gradient - purple to blue -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for energy -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow gradient -->
    <radialGradient id="shadowGradient">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Shadow sphere -->
  <circle cx="20" cy="20" r="17" fill="url(#shadowGradient)" />
  
  <!-- Main sphere with gradient -->
  <circle cx="20" cy="20" r="16" fill="url(#primaryGradient)" />
  
  <!-- Inner highlight for depth -->
  <ellipse cx="18" cy="16" rx="8" ry="6" fill="#ffffff" opacity="0.15" />
  
  <!-- Connecting nodes representing team collaboration -->
  <g id="network">
    <!-- Central hub -->
    <circle cx="20" cy="20" r="2" fill="#ffffff" opacity="0.9" />
    
    <!-- Orbiting nodes -->
    <circle cx="20" cy="11" r="1.8" fill="url(#accentGradient)" />
    <circle cx="29" cy="20" r="1.8" fill="url(#accentGradient)" />
    <circle cx="20" cy="29" r="1.8" fill="url(#accentGradient)" />
    <circle cx="11" cy="20" r="1.8" fill="url(#accentGradient)" />
    
    <!-- Diagonal nodes for more complexity -->
    <circle cx="27" cy="13" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="13" cy="13" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="27" cy="27" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="13" cy="27" r="1.2" fill="#ffffff" opacity="0.7" />
  </g>
  
  <!-- Connection lines -->
  <g id="connections" stroke="#ffffff" stroke-width="1" opacity="0.4">
    <!-- Main connections -->
    <line x1="20" y1="20" x2="20" y2="11" />
    <line x1="20" y1="20" x2="29" y2="20" />
    <line x1="20" y1="20" x2="20" y2="29" />
    <line x1="20" y1="20" x2="11" y2="20" />
    
    <!-- Cross connections -->
    <line x1="20" y1="11" x2="27" y2="13" />
    <line x1="20" y1="11" x2="13" y2="13" />
    <line x1="29" y1="20" x2="27" y2="27" />
    <line x1="29" y1="20" x2="27" y2="13" />
    <line x1="20" y1="29" x2="27" y2="27" />
    <line x1="20" y1="29" x2="13" y2="27" />
    <line x1="11" y1="20" x2="13" y2="27" />
    <line x1="11" y1="20" x2="13" y2="13" />
  </g>
  
  <!-- Outer ring for modern tech feel -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="url(#primaryGradient)" stroke-width="0.5" opacity="0.6" />
</svg>

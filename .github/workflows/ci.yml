name: SynergySphere CI/CD

on:
  push:
    branches: [ main, master, narvin ]
  pull_request:
    branches: [ main, master, narvin ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL}}
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

      - name: Drizzle Schema Check
        run: npm run db:generate

      - name: Check Server Build
        run: npx tsc src/server/index.ts --noEmit --skipLibCheck
